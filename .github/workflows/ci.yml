name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        # These are offline: H3 maths and the dbt category mapping. No cloud
        # credentials are needed, and no BigQuery calls are made in CI.
        run: uv run pytest -q
